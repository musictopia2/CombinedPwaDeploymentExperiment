name: Build Combined PWAs

run-name: Build Combined PWAs ${{ inputs.request_id }}

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      clear_render_cache:
        description: Clear Render build cache after publishing
        required: false
        default: false
        type: boolean

      request_id:
        description: Identifier supplied by the management app
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: combined-pwa-deployment
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@v7

      - name: Install .NET 11 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - name: Build apps listed in apps.txt
        run: python3 scripts/build-site.py

      - name: Publish website files to render branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: render
          publish_dir: ./site
          force_orphan: true
          commit_message: Publish combined PWAs

      - name: Clear Render build cache and deploy published files
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.clear_render_cache }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_PUBLISH_BRANCH: render
        run: python3 scripts/clear-render-cache.py